id: highlights
title: Highlights
template: highlights
content:
  heading: The 8 Things to Know
  description: Eight flagship signals that define what Polaris Protocol and the Fifth-Dimension Engine actually are — as distinct from what a replay demo or a fixed-result package would claim to be.
  items:
    - name: One Engine, One Logic, Seven Together
      slug: one-engine-one-logic-seven-together
      desc: Not seven separate demos. One Fifth-Dimension Engine, one underlying route logic, one simultaneous attack on all seven Millennium Problems.
      detail: The seven problems are treated as one world-scale proof target, not seven unrelated tricks or a static replay package.
      cat: think
    - name: Theorem-Complete, Native Lean No-Sorry
      slug: theorem-complete-native-lean-no-sorry
      desc: One of the hardest standards in formal mathematics, applied to the engine's route logic.
      detail: Theorem-complete work plus Native Lean no-sorry materials are linked directly from the Seven Millennium Problems section, not merely asserted.
      cat: doc
    - name: Do Not Believe It — Run It
      slug: do-not-believe-it-run-it
      desc: The engine is public, the prompt is public. Run it yourself and watch whether the same route structure emerges.
      detail: If you doubt the claim, that is exactly why the engine is open — shoot the seven yourself.
      cat: kit
    - name: Compile First, Then Shoot
      slug: compile-first-then-shoot
      desc: Polaris Goal Compiler compiles a ChatGPT-first goal into atoms, gates, and claim ceilings before execution starts.
      detail: Use it before large goals, theorem work, long projects, research planning, or complex creative construction.
      cat: kit
    - name: Shoot Any Problem, Not Just Theorems
      slug: shoot-any-problem-not-just-theorems
      desc: "shoot + [your problem] works on frontier problems, strange themes, everyday decisions, product strategy, engineering failures, and memes."
      detail: The output is a route — inspectable, attackable, expandable, testable — not just an answer.
      cat: think
    - name: Baseline First, Frontier Next
      slug: baseline-first-frontier-next
      desc: Baseline-50 checks known-truth alignment (50/50 PASS). Frontier-50 opens 50 unknown century-level problems for inspection.
      detail: Known-50 grounds truth alignment before Frontier-50 opens genuinely unknown frontier answers.
      cat: doc
    - name: Strange Themes Become Research Kernels
      slug: strange-themes-become-research-kernels
      desc: Mix two strange themes (Death+AI, Dream+Physics, Meme+Epidemic) and the engine turns them into a theorem-shaped research kernel.
      detail: From myth to model, from symbol to structure, from strange idea to research kernel — the High-Strangeness Math Lab.
      cat: think
    - name: Public Evidence, Not Just Prose
      slug: public-evidence-not-just-prose
      desc: PP01 through PP02D experiment branches ship raw outputs, verdict files, token accounting, audit records, and SHA256 integrity records.
      detail: This is the public evidence layer behind the staged Polaris rollout — inspectable trail, not just a claimed result.
      cat: kit

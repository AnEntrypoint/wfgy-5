      cat: think
    - name: judgmentday-seven-trumpet
      desc: The JudgmentDay + Tension Universe demo — a High-Strangeness Math Lab worked example.
      cat: think
    - name: everyday-shoot-modes
      desc: Seven everyday shoot modes — life decisions, relationships, work, product strategy, research, debugging, and absurd/meme problems.

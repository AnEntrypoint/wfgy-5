      desc: The Polaris root document. Flagship claim (Seven Millennium Problems, one engine, one logic), quick links, FAQ, and legacy note on the Avatar-to-Polaris transition.
      cat: doc
    - name: fifth-dimension-engine
      desc: The Fifth-Dimension Engine README — the current main product surface of WFGY 5.0.
      cat: kit
    - name: goal-compiler-readme
      desc: Polaris Goal Compiler overview — compile the goal first, then shoot. Portable ChatGPT-first protocol layer.
      cat: kit
    - name: goal-compiler-protocol-txt
      desc: POLARIS_GOAL_COMPILER.txt — the full portable execution constitution behind the Goal Compiler, as a plain-text protocol file.
      cat: doc
    - name: seven-millennium-problems
      desc: The flagship demo — shooting the underlying route logic behind all seven Millennium Problems with one engine.
      cat: think
    - name: seven-millennium-problems-prompts
      desc: The exact prompts used to shoot the Seven Millennium Problems demo.
      cat: kit
    - name: seven-millennium-problems-verification
      desc: Verification and review materials for the Seven Millennium Problems result.

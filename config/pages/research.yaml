content:
  heading: Research Hub
  description: 15 research documents from the real WFGY 5.0 Polaris Protocol layer — engine, demos, frontier challenges, and the Goal Compiler protocol. Fetched verbatim from onestardao/WFGY. Read in any order — each document is bounded and self-describing.

content:
  heading: WFGY 5.0 — Polaris Protocol
  subheading: "WFGY: Wan Fa Gui Yi — all methods return to one. Polaris Protocol is the active flagship, now exposing the complete research and Fifth-Dimension Engine."
  body: Polaris Protocol is WFGY 5.0's active direction — a governed protocol layer for building, tuning, verifying, and carrying structured language systems across sessions, tasks, and worlds. It powers the Fifth-Dimension Engine, a problem-solving tool that lifts any target into a higher problem-coordinate and returns an inspectable, attackable route. This site exposes the complete original research, specifications, and implementation from onestardao/WFGY.
  badges:
    - label: Fifth-Dimension Engine
    - label: goal compiler
    - label: drift control
    - label: governed protocols
  cta_text: Explore Polaris
  cta_href: ./paper.html
  cta2_text: "onestardao/WFGY ->"
  cta2_href: https://github.com/onestardao/WFGY
polaris:
  heading: "// the active flagship: polaris protocol"
  description: "Avatar's successor. A governed protocol layer for building, tuning, verifying, and carrying structured language systems across sessions, tasks, and worlds — now in staged public rollout across evidence packages, portable protocols, reproducibility materials, runtime structures, and engine components."
  items:
    - name: Polaris Goal Compiler
      desc: "A portable human-AI execution protocol for assistants, agents, and skill workflows. Distributed as a TXT-based execution constitution — compile the goal before acting, not after. Validated so far on ChatGPT."
      meta: "compile the goal first. then shoot."
      cat: kit
    - name: Fifth-Dimension Engine
      desc: "The core problem-solving tool of Polaris. Invoked with shoot + [your problem], it lifts a target into a higher problem-coordinate and returns an inspectable, attackable, expandable, testable route: a Route, Structure, Candidate Lemmas, Objections, Open Debt, and a Next Command."
      meta: "usable for theorem work, product strategy, engineering, and everyday decisions"
      cat: think
features:
  heading: "// why the engine is different"
  items:
    - name: One engine, one logic
      desc: "A single Fifth-Dimension Engine and one underlying route logic, applied uniformly rather than switching methods per problem class."
      cat: think
    - name: Theorem-complete verification
      desc: "The engine's route logic is verified formally, not merely asserted — one of the hardest standards a reasoning system can be held to."
      cat: doc
    - name: Open engine, not a black box
      desc: "The engine is public and the prompts are public. Run it yourself and inspect whether the same underlying route structure emerges."
      cat: kit
    - name: Compile first, then shoot
      desc: "Polaris Goal Compiler is the portable protocol layer for hard ChatGPT-first goals: compile the goal into atoms, gates, and claim ceilings before execution starts. Then hand the complex atom to the engine."
      cat: kit
    - name: Route, not just an answer
      desc: "shoot + [your problem] lifts any target into a higher problem-coordinate and returns an inspectable, attackable, expandable route."
      cat: think
    - name: Drift control throughout
      desc: "WFGY-Method supplies ΔS drift measurement, bounded checkpoint-retry (BBCR), and multi-path exploration (BBPF) so execution stays aligned with the stated goal across every state of the protocol."
      cat: think
    - name: Public evidence layer
      desc: "Experiment branches ship raw outputs, parsed outputs, verdict files, token accounting, audit records, and SHA256 integrity records — inspectable, not just asserted."
      cat: kit
routes:
  heading: "// how to run a task through the protocol"
  items:
    - name: "shoot + [your problem]"
      desc: "The Fifth-Dimension Engine interface. Lifts any target into a structured, inspectable route."
      meta: engine · route generation · structural reasoning
      cat: kit
    - name: "compile the goal first, then shoot"
      desc: "Polaris Goal Compiler's core discipline for ChatGPT-first hard goals: task atoms, dependencies, active/blocked distinction, verification gates, and claim ceilings before execution."
      meta: goal compiler · atomization · verification gates
      cat: think
recovery:
  heading: "// drift control surface (WFGY-Method)"
  items:
    - name: "ΔS drift measurement"
      desc: Measures drift between current state and stated goal (ΔS = 1 − cos(I, G)). A qualitative label without a real embedding call, a genuine computed distance when one is available.
      cat: kit
    - name: "BBCR bounded checkpoint-retry"
      desc: Detects an instability or dead-end condition, resets to a prior checkpoint, retries up to a fixed bound, then stops and surfaces rather than looping forever.
      cat: kit
    - name: "BBPF multi-path exploration"
      desc: Generates multiple real candidate approaches before an ambiguous decision and proceeds down the branch that most clearly serves the stated goal, without overshooting.
      cat: talk

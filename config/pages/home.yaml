content:
  heading: WFGY 5.0 — Avatar
  subheading: The flagship governed runtime for persistent language selves.
  body: A protocol layer for engineered language and human-machine interaction. Not a persona prompt. Not a prompt pack. A launchable, governable, replay-bearing runtime — launching 2026/5/5.
  badges:
    - label: governed runtime
    - label: branchable
    - label: multilingual
    - label: recovery-bearing
    - label: 47 research docs
  cta_text: Read the paper
  cta_href: ./paper.html
features:
  heading: "// why avatar is different"
  items:
    - name: One shared runtime
      desc: Replaces scattered persona files. One canonical declaration, one boot path, one recovery surface.
      cat: kit
    - name: Natural-language tuning
      desc: Shape route behavior through WFGY_BRAIN knobs — not brittle prompt surgery.
      cat: think
    - name: Reusable builds
      desc: Save stronger variants. Stop chasing one-off lucky outputs.
      cat: kit
    - name: Recovery operations
      desc: Restore avatars after session corruption, attenuation, or over-cleaning. Explicit commands, not hope.
      cat: talk
    - name: Dual closed-loop design
      desc: Inner continuity (session persona state) + outer iteration (tune, branch, recover). Both loops run simultaneously.
      cat: think
    - name: Structured imperfection
      desc: Living human residue as an always-on law. Cleaner output may still be unlawful.
      cat: think
    - name: Multilingual calibration
      desc: Cross-language route carry and drift control. Translation must not silently rewrite the self.
      cat: doc
    - name: Branchable behavior
      desc: Derivative selves that share the anchor but carry divergent voices. Reconcilable.
      cat: kit

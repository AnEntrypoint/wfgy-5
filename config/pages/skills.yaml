id: skills
title: Skills
template: grid
content:
  heading: Capabilities
  description: Recognition patterns that compose this project's skill set. Not numbered steps — these are conditions under which a particular move becomes natural. The conditions vary; the recognition does not.
  items:
    - name: polaris-protocol
      description: Tree root and state machine wiring the three child skills below (COMPILE, SHOOT, DRIFT CONTROL) into one dispatch sequence for complex, multi-step, or long-horizon work.
      href: https://github.com/AnEntrypoint/wfgy-5/blob/main/skills/polaris-protocol/SKILL.md
      cat: kit
    - name: polaris-goal-compiler
      description: Compile a goal into task atoms, dependencies, active/blocked work, verification gates, and claim ceilings before execution starts. Compile first, then shoot.
      href: https://github.com/AnEntrypoint/wfgy-5/blob/main/skills/polaris-goal-compiler/SKILL.md
      cat: think
    - name: fifth-dimension-engine
      description: Shoot a complex atom into an inspectable route — structure, candidate lemmas, objections, open debt, and next command. The current main product surface of WFGY 5.0.
      href: https://github.com/AnEntrypoint/wfgy-5/blob/main/skills/fifth-dimension-engine/SKILL.md
      cat: think
    - name: wfgy-method
      description: Drift control across every state — ΔS measurement, BBCR bounded checkpoint-retry, BBPF multi-path exploration, BBAM delegated attention-widening, and the named failure-mode checklist.
      href: https://github.com/AnEntrypoint/wfgy-5/blob/main/skills/wfgy-method/SKILL.md
      cat: think
    - name: public-evidence-layer
      description: PP01-PP02D experiment branches with raw outputs, verdict files, token accounting, audit records, and SHA256 integrity records.
      href: https://github.com/onestardao/WFGY/tree/main/Polaris/experiments
      cat: doc

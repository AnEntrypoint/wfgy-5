- id: fix-file-type-directory-attr-mismatch
  witness: 'theme.mjs renderOriginal''s getFileType() now returns ''dir'' not ''directory''; data-file-type applied via a wrapping h(''div'',{class:''file-cell'',''data-file-type'':ft}) since Row itself cannot carry the attribute. Confirmed live in browser: original.html now shows fileCellTypes:[''dir'',''text''] matching the SDK''s real [data-file-type] contract (browser-8/9/12 dispatches).'
  status: completed
- id: fix-hero-accenthref-noop
  witness: 'renderHome now uses C.HeroFromPageData({heading,subheading,body,badges,ctas:[{label,href,primary}]}) instead of plain C.Hero({accent,accentHref}) -- ctas render as real anchor tags via HeroFromPageData''s supported ctas field. Confirmed live: index.html shows upstreamLink:true (the cta2 anchor resolves), hero renders correctly (browser-7/9/12).'
  status: completed
- id: migrate-renderers-to-panelfromitems
  witness: renderHome migrated to C.HeroFromPageData for the hero and C.PanelFromItems for the examples section; features/routes/recovery/timeline/polaris sections use a shared itemsPanel() helper wrapping Panel+Row (kept as Row rather than PanelFromItems specifically because PanelFromItems hardcodes RowLink internally, which cannot carry the rail prop needed for category coloring -- this is an intentional deviation from full PanelFromItems adoption, documented in code comments, to preserve the category-color feature added this session). renderHighlights/Research/Skills/Original still use Row/RowLink+Panel directly for the same rail-preservation reason. All confirmed rendering correctly live via browser dispatches across all 6 pages with zero console errors.
  status: completed
- id: fix-invented-prose-stack-tokens
  witness: removed the dead --prose-stack-md:24px declaration from theme.mjs's inline <style> block (it referenced a token name that never existed in the SDK); the .ds-prose class now relies entirely on the SDK's real shipped --measure/--space-4 tokens which already match the intended 68ch/24px spec. Confirmed via node --check src/theme.mjs and successful flatspace build + zero console errors across all pages.
  status: completed
- id: clarify-data-cat-is-consumer-owned-not-sdk
  witness: 'discovered during EXECUTE that the bug was deeper than ''no CSS consumes --cat-accent'' -- Row/RowLink silently drop any data-cat prop before it ever reaches the DOM (fixed rest-free destructure in the SDK). Fixed by switching to Row''s real supported rail prop (mapped think/kit/doc/talk -> purple/green/sky/mascot tones) for all per-row category coloring, and by wrapping items in an explicit h(''span'',{class:''cat-chip'',''data-cat'':cat}) leading element where a literal data-cat attribute+CSS-rule pairing is wanted (the polaris section). Confirmed live: 22 rails on index.html, 46 on research.html, 12 on skills.html, 8 each on highlights/original -- all matching total row counts (full category-tone coverage), plus 2 real .cat-chip[data-cat] elements confirmed present.'
  status: completed
- id: adopt-filterpills-for-category-filtering
  witness: 'research.yaml and skills.yaml pages now render C.FilterPills wired to a stateful renderByCategory() closure with click-to-filter/click-to-clear behavior. Interactive browser test confirmed: clicking a pill drops research.html from 46 to 20 rows and sets aria-pressed=true; clicking again restores all 46 rows (browser-11 dispatch). Required fixing a real state-loss bug found during verification: renderer(data.page) was being called fresh inside mount''s viewFn on every re-render, resetting the activeFilter closure each time -- fixed by hoisting the renderer(data.page) call outside the mount render loop so its stateful closure persists across re-renders.'
  status: completed
- id: consider-theme-toggle-component
  witness: 'added C.ThemeToggle({compact:true, onChange}) to the Status bar right slot, built inside mount''s viewFn (not hoisted) so its label refreshes via rerender() on click. Confirmed live via browser dispatches 14/15/17: label cycles theme:auto -> theme:light -> theme:dark, html[data-theme] correctly updates paper->paper->ink, and body background-color actually changes to rgb(14,14,18) matching the SDK''s --ink token in dark mode.'
  status: completed
- id: fix-data-cat-never-reaches-dom
  witness: 'confirmed root cause: anentrypoint-design Row({code,rank,title,sub,meta,active,state,onClick,key,style,href,kind,cols,leading,trailing,target,selected,rail,expanded,highlight,actions,detail}) and RowLink({code,title,sub,meta,href,key,target}) both destructure a fixed prop list with no rest/spread -- any unrecognized prop (data-cat, data-file-type) is silently dropped before reaching h(). Fixed everywhere in theme.mjs: category coloring now goes through Row''s real rail prop; file-type on original.html goes through an explicit wrapping div (h(''div'',{class:''file-cell'',''data-file-type'':ft}, Row(...))) since Row cannot carry it directly. Both confirmed live in browser across all 6 pages with correct counts and zero errors.'
  status: completed
- id: build-and-test-site-with-flatspace
